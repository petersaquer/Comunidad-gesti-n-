# ==============================================================================
# S16 INDERT - Configuración Nginx Reverse Proxy para HestiaCP (Node.js + Express)
# Ubicación en HestiaCP:
#   Opción A: /home/<usuario>/conf/web/<dominio>/nginx.ssl.conf_custom
#   Opción B: Guardar como plantilla en /usr/local/hestia/data/templates/web/nginx/
# ==============================================================================

# Proxy inverso hacia el backend Node.js (PM2 en puerto 3000)
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # Encabezados para WebSockets y soporte SPA
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    # Encabezados de IP real del visitante para auditoría y rate-limiting
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Tiempos de espera para subida de respaldos grandes o reportes PDF/Excel
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 20M;
}

# Optimización y caché de archivos estáticos de Vite (JS, CSS, Imágenes, Fuentes)
location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
    proxy_pass http://127.0.0.1:3000;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

# Desactivar logs innecesarios
location = /favicon.ico {
    log_not_found off;
    access_log off;
}

location = /robots.txt {
    log_not_found off;
    access_log off;
}
